<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Магазин</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Онлайн-Магазин</h1>
        <button id="cart-btn" class="cart-btn">Корзина (<span id="cart-count">0</span>)</button>
    </header>

    <main>

        <div id="ecom-widget" style="height: 500px">
            <script src="https://widget.pochta.ru/map/widget/widget.js"></script>
            <script>
                function callbackFunction(response) {
                    console.log('Ответ из виджета:', response);
                }

                ecomStartWidget({
                    accountId: 59047,
                    accountType: "other_cms",
                    callbackFunction: callbackFunction,
                    containerId: 'ecom-widget'
                });
            </script>
        </div>

        <section class="products">
            <article class="product-card">
                <img src="https://images.biggeek.ru/1/870/a242/22739-99718518-503Airpodspro2@2x.png" alt onerror="this.src='//cdn.diginetica.net/images/noimage.png';">
                <h2>AirPods Pro 2</h2>
                <p class="product-price">18990 <span>₽</span></p>
                <button class="add-to-cart">Добавить в корзину</button>
            </article>
            <article class="product-card">
                <img src="https://images.biggeek.ru/1/870/3f4b/28405-907airpods-4-hero-select-202409@2x.jpg" alt onerror="this.src='//cdn.diginetica.net/images/noimage.png';">
                <h2>AirPods 4</h2>
                <p class="product-price">11990 <span>₽</span></p>
                <button class="add-to-cart">Добавить в корзину</button>
            </article>
            <article class="product-card">
                <img src="https://images.biggeek.ru/1/870/e97a/22698-93t_natural@2x.jpg" alt onerror="this.src='//cdn.diginetica.net/images/noimage.png';">
                <h2>iPhone 15 Pro Max</h2>
                <p class="product-price">188990 <span>₽</span></p>
                <button class="add-to-cart">Добавить в корзину</button>
            </article>
            <article class="product-card">
                <img src="https://images.biggeek.ru/1/870/7156/22664-866Pink@2x.jpg" alt onerror="this.src='//cdn.diginetica.net/images/noimage.png';">
                <h2>iPhone 15 Pro</h2>
                <p class="product-price">110990 <span>₽</span></p>
                <button class="add-to-cart">Добавить в корзину</button>
            </article>
            <article class="product-card">
                <img src="//images.biggeek.ru/1/870/2834/31867-37725281-460127602g_-cgi-2x@2x.jpeg" alt onerror="this.src='//cdn.diginetica.net/images/noimage.png';">
                <h2>MacBook Air 15 (M4)</h2>
                <p class="product-price">1990 <span>₽</span></p>
                <button class="add-to-cart">Добавить в корзину</button>
            </article>
            <article class="product-card">
                <img src="//images.biggeek.ru/1/870/d6e5/29830-33223696-742mb16_black@2x.jpg" alt onerror="this.src='//cdn.diginetica.net/images/noimage.png';">
                <h2>MacBook Air 15 (M2)</h2>
                <p class="product-price">1980 <span>₽</span></p>
                <button class="add-to-cart">Добавить в корзину</button>
            </article>
            <article class="product-card">
                <img src="//images.biggeek.ru/1/870/0176/19900-21716_Space Gray@2x.jpeg" alt onerror="this.src='//cdn.diginetica.net/images/noimage.png';">
                <h2>MacBook Air 15 (M1)</h2>
                <p class="product-price">1970 <span>₽</span></p>
                <button class="add-to-cart">Добавить в корзину</button>
            </article>
        </section>
    </main>

    <div id="cart-modal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <h3>Корзина</h3>
                <span class="close-btn">&times;</span>
            </div>

            <div class="modal-content">
                <ul id="cart-items"></ul>
                <p>К оплате: <span id="cart-total-sum">0</span> руб.</p>
            </div>

            <div class="modal-footer">
                <button class="btn-get-order" id="checkout">Оформить заказ</button>
            </div>
        </div>
    </div>

    <div id="order-modal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <h3>Оформление заказа</h3>
                <span class="close-btn">&times;</span>
            </div>

            <div class="modal-content">
                <form id="order-form">
                    <input type="text" name="name" placeholder="Имя" required>
                    <input type="text" name="surname" placeholder="Фамилия" required>
                    <input type="text" name="address" placeholder="Адрес доставки" required>
                    <input type="tel" name="phone" placeholder="Номер телефона" required>
                    <button type="submit">Создать заказ</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
